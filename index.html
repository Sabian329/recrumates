    <!-- Structured Data - Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "RecruMates",
      "alternateName": "RecruMates Recruitment Agency",
      "url": "https://recrumates.pl",
      "logo": "https://recrumates.pl/logo.png",
      "description": "Agencja rekrutacyjna specjalizująca się w rekrutacji IT, handlowej, inżynierskiej, CyberSec i managerskiej. Wrocław, Polska.",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Wrocław",
        "addressRegion": "Dolnośląskie",
        "addressCountry": "PL"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "kontakt@recrumates.pl",
        "contactType": "customer service"
      },
      "sameAs": [
        "https://www.linkedin.com/company/recrumates"
      ],
      "numberOfEmployees": {
        "@type": "QuantitativeValue",
        "minValue": 11,
        "maxValue": 50
      },
      "areaServed": {
        "@type": "Country",
        "name": "Poland"
      }
    }
    </script>
    
    <!-- Structured Data - ProfessionalService -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "RecruMates",
      "description": "Agencja rekrutacyjna oferująca kompleksowe usługi rekrutacyjne, doradztwo HR i employer branding.",
      "url": "https://recrumates.pl",
      "telephone": "+48-XXX-XXX-XXX",
      "email": "kontakt@recrumates.pl",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Wrocław",
        "addressRegion": "Dolnośląskie",
        "addressCountry": "PL"
      },
      "priceRange": "Success Fee od 8%",
      "serviceType": [
        "Rekrutacja end-to-end",
        "Doradztwo HR",
        "Employer Branding",
        "RPO"
      ],
      "areaServed": {
        "@type": "Country",
        "name": "Poland"
      }
    }
    </script>
    
    <!-- Structured Data - FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Jakie są koszty usług rekrutacyjnych?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Oferujemy elastyczne modele rozliczeń. Standardowy model to Success Fee od 8% rocznego wynagrodzenia kandydata. Oferujemy również opcję fix price oraz RPO (Recruitment Process Outsourcing) dostosowane do potrzeb klienta."
          }
        },
        {
          "@type": "Question",
          "name": "W jakich obszarach się specjalizujecie?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Specjalizujemy się w rekrutacji na stanowiska handlowe, IT, inżynierskie, CyberSec oraz managerskie. Działamy elastycznie i opieramy się na zaufaniu oraz głęboko relacyjnej współpracy."
          }
        },
        {
          "@type": "Question",
          "name": "Jak długo trwa proces rekrutacyjny?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Czas trwania procesu zależy od specyfiki stanowiska i dostępności kandydatów. Dzięki wykorzystaniu narzędzi AI i naszemu doświadczeniu, staramy się skrócić czas rekrutacji przy zachowaniu wysokiej jakości dopasowania."
          }
        },
        {
          "@type": "Question",
          "name": "Czy działacie tylko w Polsce?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Nasza główna siedziba znajduje się we Wrocławiu, ale działamy w całej Polsce oraz mamy możliwość prowadzenia rekrutacji międzynarodowej. Wytrwałość i determinacja to nasze atuty w poszukiwaniu talentów na całym świecie."
          }
        }
      ]
    }
    </script>

      document.documentElement.classList.add('dark');
